name: ClaimLab preregistered candidate arena

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/claimlab_candidate_arena.py"
      - "research/CANDIDATE_ARENA_PREREGISTRATION.json"
      - "tests/test_candidate_arena.py"
      - ".github/workflows/candidate-arena.yml"

permissions:
  contents: read

jobs:
  candidate-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Test candidate information boundaries
        run: PYTHONPATH=. pytest -q tests/test_candidate_arena.py
      - name: Run pre-registered real-data arena
        run: PYTHONPATH=. python scripts/claimlab_candidate_arena.py
      - name: Preserve candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-arena-evidence
          path: evidence/candidate-arena/candidate_arena.json
          if-no-files-found: error
          retention-days: 30

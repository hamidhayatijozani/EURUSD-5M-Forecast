name: live-minute-research
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
concurrency:
  group: live-minute-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: PYTHONPATH=. pytest -q
      - run: PYTHONPATH=. LIVE_CYCLES=5 python scripts/live_minute_loop.py
      - uses: actions/upload-artifact@v4
        with:
          name: live-minute-${{ github.run_number }}
          path: |
            research/live_state.json
            research/live_predictions.jsonl

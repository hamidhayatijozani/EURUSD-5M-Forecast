name: live-minute-research
# Manual execution supports a freshness-checked live evidence run.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
concurrency:
  group: live-minute-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - name: refresh public source availability
        run: PYTHONPATH=. python -c "from engine.trader_sources import refresh_public_source_snapshot; refresh_public_source_snapshot()"
      - name: live minute forecast loop
        env:
          ELECTRICITY_MAPS_API_KEY: ${{ secrets.ELECTRICITY_MAPS_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research
          PYTHONPATH=. LIVE_CYCLES=5 python scripts/live_minute_loop.py 2>&1 | tee research/live_minute_run.log
      - name: evaluate forward cross-asset paper ledger
        if: always()
        run: PYTHONPATH=. python scripts/evaluate_live_cross_asset.py
      - name: preserve live diagnostics even when forecasting fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-minute-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            research/live_minute_run.log
            research/live_state.json
            research/live_predictions.jsonl
            research/claimlab_live_observations.jsonl
            research/cross_asset_live_observations.jsonl
            evidence/cross-asset-forward-evaluation.json

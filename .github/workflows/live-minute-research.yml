name: live-minute-research
# Manual execution supports a freshness-checked live evidence run.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
concurrency:
  group: live-minute-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - name: classify FX weekly session
        id: fx_session
        run: |
          mkdir -p research
          PYTHONPATH=. python -m engine.market_session --github-output "$GITHUB_OUTPUT" --json-path research/market_session.json
      - name: refresh public source availability
        run: PYTHONPATH=. python -c "from engine.trader_sources import refresh_public_source_snapshot; refresh_public_source_snapshot()"
      - name: live minute forecast loop
        if: steps.fx_session.outputs.market_open == 'true'
        env:
          ELECTRICITY_MAPS_API_KEY: ${{ secrets.ELECTRICITY_MAPS_API_KEY }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_API_BASE: ${{ vars.OANDA_API_BASE }}
          OANDA_ENVIRONMENT: ${{ vars.OANDA_ENVIRONMENT }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY || secrets.TWELVE_DATA_API_KEY }}
          LIVE_FEED_PROVIDERS: oanda,twelvedata,yahoo
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research
          PYTHONPATH=. LIVE_CYCLES=5 python scripts/live_minute_loop.py 2>&1 | tee research/live_minute_run.log
      - name: evaluate forward cross-asset paper ledger
        if: always()
        run: PYTHONPATH=. python scripts/evaluate_live_cross_asset.py
      - name: evaluate forward GBPUSD-USDJPY paper family
        if: always()
        run: PYTHONPATH=. python scripts/evaluate_live_cross_asset_v2.py
      - name: evaluate forward paper account (no broker orders)
        if: always()
        run: PYTHONPATH=. python scripts/paper_account.py
      - name: preserve live diagnostics even when forecasting is skipped or fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-minute-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            research/market_session.json
            research/live_minute_run.log
            research/paper_account/
            research/live_state.json
            research/live_predictions.jsonl
            research/claimlab_live_observations.jsonl
            research/cross_asset_live_observations.jsonl
            research/live_decision_evidence.jsonl
            research/live_decision_settlements.jsonl
            research/live_evidence.db
            evidence/cross-asset-forward-evaluation.json
            research/LIVE_CROSS_ASSET_PREREGISTRATION_V2.json
            evidence/cross-asset-forward-evaluation-v2.json

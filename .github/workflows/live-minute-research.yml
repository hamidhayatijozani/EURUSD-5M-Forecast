name: live-minute-research
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
concurrency:
  group: live-minute-research
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - name: refresh public source availability
        run: PYTHONPATH=. python -c "from engine.trader_sources import refresh_public_source_snapshot; refresh_public_source_snapshot()"
      - name: live minute forecast loop
        env:
          ELECTRICITY_MAPS_API_KEY: ${{ secrets.ELECTRICITY_MAPS_API_KEY }}
        run: PYTHONPATH=. LIVE_CYCLES=5 python scripts/live_minute_loop.py
      - uses: actions/upload-artifact@v4
        with:
          name: live-minute-${{ github.run_number }}
          path: |
            research/live_state.json
            research/live_predictions.jsonl
            research/claimlab_live_observations.jsonl

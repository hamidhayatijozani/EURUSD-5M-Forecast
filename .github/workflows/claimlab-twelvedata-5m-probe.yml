name: ClaimLab Twelve Data EURUSD 5m live probe

# Manual only: this read-only probe consumes one provider request and does not
# create forecasts, paper trades, broker sessions, or real orders.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ingestion dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe one completed EURUSD 5m candle (read-only)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY || secrets.TWELVE_DATA_API_KEY }}
        run: PYTHONPATH=. python scripts/twelvedata_live_probe.py
      - name: Upload sanitized 5m provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claimlab-twelvedata-5m-${{ github.run_id }}
          path: evidence/claimlab-market/twelvedata-latest.json
          if-no-files-found: error
          retention-days: 14

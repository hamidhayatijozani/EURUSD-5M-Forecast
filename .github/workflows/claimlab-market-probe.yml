name: ClaimLab EURUSD market probe

on:
  workflow_dispatch:
  push:
    paths:
      - "claimlab/**"
      - "scripts/claimlab_market_probe.py"
      - "requirements.txt"
      - ".github/workflows/claimlab-market-probe.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch and validate EURUSD 5m candle
        run: PYTHONPATH=. python scripts/claimlab_market_probe.py
      - name: Upload market evidence
        uses: actions/upload-artifact@v4
        with:
          name: claimlab-market-eurusd-${{ github.run_id }}
          path: evidence/claimlab-market/latest.json

name: paper-account-tests
on:
  pull_request:
    paths:
      - "scripts/paper_account.py"
      - "tests/test_paper_account.py"
      - ".github/workflows/paper-account-tests.yml"
  push:
    branches:
      - "feature/forward-paper-account-v1"
    paths:
      - "scripts/paper_account.py"
      - "tests/test_paper_account.py"
      - ".github/workflows/paper-account-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8,<9"
      - run: PYTHONPATH=. pytest -q tests/test_paper_account.py

name: autonomous-research-supervisor\n\non:\n  workflow_run:\n    workflows: ["live-minute-research"]\n    types: [completed]\n\nconcurrency:\n  group: autonomous-research-supervisor\n  cancel-in-progress: false\n\npermissions:\n  contents: write\n\njobs:\n  supervise:\n    if: ${{ github.event.workflow_run.conclusion == 'failure' }}\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: main\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n\n      - run: python -m pip install -r requirements.txt\n\n      - name: diagnose and mechanically repair safe source corruption\n        run: PYTHONPATH=. python scripts/autonomous_supervisor.py\n\n      - name: full regression gate after repair\n        run: PYTHONPATH=. pytest -q\n\n      - name: persist supervisor evidence\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add scripts/autonomous_supervisor.py research/autonomous_supervisor.log\n          git diff --cached --quiet || git commit -m "chore: persist autonomous supervisor evidence"\n          git push
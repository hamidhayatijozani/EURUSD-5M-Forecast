name: autonomous-research-supervisor

on:
  workflow_run:
    workflows: ["live-minute-research"]
    types: [completed]

concurrency:
  group: autonomous-research-supervisor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  supervise:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt

      - name: diagnose and mechanically repair safe source corruption
        run: PYTHONPATH=. python scripts/autonomous_supervisor.py

      - name: full regression gate after repair
        run: PYTHONPATH=. pytest -q

      - name: persist supervisor evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/autonomous_supervisor.py research/autonomous_supervisor.log
          git diff --cached --quiet || git commit -m "chore: persist autonomous supervisor evidence"
          git push

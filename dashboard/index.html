<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EUR/USD 5M Forecast Lab</title><style>body{margin:0;background:#0b0e13;color:#e8edf5;font:14px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#121722;border:1px solid #263044;border-radius:10px;padding:16px}.wide{grid-column:span 4}.value{font-size:28px;font-weight:700}.muted{color:#8e9ab0}button{background:#e8edf5;color:#0b0e13;border:0;border-radius:7px;padding:9px 14px;font-weight:700;cursor:pointer}canvas{width:100%;height:320px;background:#0d1119;border-radius:8px}table{width:100%;border-collapse:collapse;margin-top:14px}td,th{padding:8px;border-bottom:1px solid #263044;text-align:left}.up{color:#69e59a}.down{color:#ff7373}.flat{color:#e5c66b}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}</style></head><body><main><h1>EUR/USD · 5M Forecast Lab</h1><p class="muted">Prediction first. Reality grades it later.</p><div class="grid"><div class="card"><div class="muted">Forecast</div><div id="direction" class="value">--</div></div><div class="card"><div class="muted">Confidence</div><div id="confidence" class="value">--</div></div><div class="card"><div class="muted">Regime</div><div id="regime" class="value">--</div></div><div class="card"><div class="muted">Recorded</div><div id="count" class="value">0</div></div><div class="card wide"><canvas id="chart" width="1000" height="320"></canvas></div><div class="card wide"><button id="demo">Generate research forecast</button><table><thead><tr><th>Time</th><th>Direction</th><th>Confidence</th><th>Regime</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="./app.js"></script></body></html>
